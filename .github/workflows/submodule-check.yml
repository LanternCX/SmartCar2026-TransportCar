name: submodule-check

on:
  pull_request:
    types: [opened, edited, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check submodule pointers
        shell: bash
        run: |
          set -euo pipefail

          check_submodule_latest() {
            local path="$1"
            local branch="$2"

            local url
            url="$(git config -f .gitmodules --get "submodule.${path}.url")"

            local configured_branch
            configured_branch="$(git config -f .gitmodules --get "submodule.${path}.branch")"
            if [[ "${configured_branch}" != "${branch}" ]]; then
              echo "::error::${path} submodule branch should be ${branch}, got ${configured_branch}"
              return 1
            fi

            local recorded
            recorded="$(git rev-parse "HEAD:${path}")"

            local latest
            latest="$(git ls-remote "${url}" "refs/heads/${branch}" | awk '{print $1}')"
            if [[ -z "${latest}" ]]; then
              echo "::error::Cannot find ${branch} in ${url}"
              return 1
            fi

            if [[ "${recorded}" != "${latest}" ]]; then
              echo "::error::${path} points to ${recorded}, but ${url} ${branch} latest is ${latest}"
              return 1
            fi

            echo "${path} points to latest ${branch}: ${recorded}"
          }

          check_submodule_latest "vision" "dev"
          check_submodule_latest "controller" "main"
