name: pr-template-check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const errors = [];

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const isBoardRelated = files.some(file => file.filename.startsWith('src/'));

            if (!body.includes('## 说明')) {
              errors.push('缺少 "## 说明" 部分');
            } else {
              const desc = body.split('## 说明')[1]?.split('##')[0]?.trim();
              if (!desc || desc.length < 10) {
                errors.push('"## 说明" 部分内容过短或为空');
              }
            }

            if (!body.includes('## 概要')) {
              errors.push('缺少 "## 概要" 部分');
            } else {
              const summary = body.split('## 概要')[1]?.split('##')[0]?.trim();
              if (!summary || summary.length < 10) {
                errors.push('"## 概要" 部分内容过短或为空');
              }
            }

            if (!body.includes('## 检查清单')) {
              errors.push('缺少 "## 检查清单" 部分');
            } else {
              const checklist = body.split('## 检查清单')[1]?.trim() || '';
              if (!checklist.match(/^- \[[xX]\] 已人工审核 PR 内容$/m)) {
                errors.push('检查清单未勾选 "已人工审核 PR 内容"');
              }
              if (!checklist.match(/^- \[[xX]\] 已人工核对概要$/m)) {
                errors.push('检查清单未勾选 "已人工核对概要"');
              }
              if (!checklist.match(/^- \[[xX]\] 相关文档已更新$/m)) {
                errors.push('检查清单未勾选 "相关文档已更新"');
              }
              if (!checklist.match(/^- \[[xX]\] 已归档 PR 有关 spec\/plan$/m)) {
                errors.push('检查清单未勾选 "已归档 PR 有关 spec/plan"');
              }
              if (isBoardRelated && !checklist.match(/^- \[[xX]\] 已进行板端测试$/m)) {
                errors.push('PR 涉及 src 目录改动，检查清单未勾选 "已进行板端测试"');
              }
            }

            if (errors.length > 0) {
              core.setFailed('PR 描述不符合模板要求：\n' + errors.join('\n'));
            }
