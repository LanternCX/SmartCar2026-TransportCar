name: test(python)

on:
  pull_request:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: uv run --no-project --with "pytest>=9.0.2" python -m pytest tests/unit -q
