<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
.title{font-size:26px;font-weight:700}
.label{font-size:18px;font-weight:600}
.small{font-size:15px}
.tiny{font-size:13px}
.field{fill:#eff6ff;stroke:#334155;stroke-width:2}
.border{fill:none;stroke:#facc15;stroke-width:18}
.accent{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:12}
.good{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}
.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:12}
.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:12}
.line{stroke:#334155;stroke-width:2.2;fill:none}
.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 7;fill:none}
.axisx{stroke:#4f46e5;stroke-width:3;fill:none}
.axisy{stroke:#059669;stroke-width:3;fill:none}
</style>
<defs>
<marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
<marker id="arrowX" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/></marker>
<marker id="arrowY" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#059669"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="550" y="42" text-anchor="middle" class="title">蚂蚁搬家场地坐标与边线校准</text>
<text x="550" y="70" text-anchor="middle" class="small">场地 3.2m × 2.4m；坐标单位 m；x+ 向右，y+ 向前；比例 1m = 200px</text>

<rect x="210" y="120" width="640" height="480" class="field"/>
<rect x="210" y="120" width="640" height="480" class="border"/>
<rect x="430" y="260" width="200" height="200" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" stroke-dasharray="9 7"/>
<text x="530" y="365" text-anchor="middle" class="small">中心 1m 见方放置区</text>

<path d="M210,600 L318,600" class="axisx" marker-end="url(#arrowX)"/>
<path d="M210,600 L210,492" class="axisy" marker-end="url(#arrowY)"/>
<text x="330" y="625" text-anchor="middle" class="label" fill="#4f46e5">x+</text>
<text x="232" y="492" class="label" fill="#059669">y+</text>
<text x="132" y="624" class="small">原点参考</text>

<text x="530" y="108" text-anchor="middle" class="label">上边线：y = 2.4</text>
<text x="530" y="628" text-anchor="middle" class="label">底边线：y = 0</text>
<text x="238" y="158" class="label">左边线：x = 0</text>
<text x="822" y="158" text-anchor="end" class="label">右边线：x = 3.2</text>

<circle cx="230" cy="700" r="8" fill="#ea580c" stroke="#9a3412" stroke-width="2"/>
<path d="M230,600 L230,692" class="dash"/>
<path d="M210,700 L222,700" class="dash"/>
<rect x="42" y="654" width="165" height="62" class="warn"/>
<text x="124" y="679" text-anchor="middle" class="label">辅车初始点</text>
<text x="124" y="702" text-anchor="middle" class="small">(x, y) = (0.10, -0.50)</text>

<rect x="895" y="135" width="160" height="68" class="good"/>
<text x="975" y="161" text-anchor="middle" class="label">贴上边</text>
<text x="975" y="185" text-anchor="middle" class="small">只校准 y = 2.4</text>
<path d="M895,169 C875,150 860,136 842,124" class="line" marker-end="url(#arrowDark)"/>

<rect x="895" y="332" width="160" height="68" class="good"/>
<text x="975" y="358" text-anchor="middle" class="label">贴右边</text>
<text x="975" y="382" text-anchor="middle" class="small">只校准 x = 3.2</text>
<path d="M895,366 L858,390" class="line" marker-end="url(#arrowDark)"/>

<rect x="895" y="496" width="160" height="68" class="good"/>
<text x="975" y="522" text-anchor="middle" class="label">贴底边</text>
<text x="975" y="546" text-anchor="middle" class="small">只校准 y = 0</text>
<path d="M895,530 C875,562 860,586 842,596" class="line" marker-end="url(#arrowDark)"/>

<rect x="25" y="332" width="160" height="68" class="good"/>
<text x="105" y="358" text-anchor="middle" class="label">贴左边</text>
<text x="105" y="382" text-anchor="middle" class="small">只校准 x = 0</text>
<path d="M185,366 L202,390" class="line" marker-end="url(#arrowDark)"/>

<rect x="302" y="660" width="456" height="48" class="accent"/>
<text x="530" y="690" text-anchor="middle" class="label">边线校准只重置单轴，不改 angle</text>
<text x="550" y="744" text-anchor="middle" class="tiny">规则依据：蚂蚁搬家正式场地 3.2m × 2.4m，黄色胶带为边界</text>
</svg>
